tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login a user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: kat8@example.com
          password:
            description: "User's password"
            type: string
            example: '123POI. Min 6 characters'
responses:
  '200':
    description: Logged a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'YthV5uRTWX61T+U0AHP/F9QyPdeg7xtJMt1QySxb'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
