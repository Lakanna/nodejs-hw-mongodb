tags:
  - Auth
summary: Get Google OAuth url
operationId: getCGoogleOAuthUrl
description: 'Get Google OAuth url for login user whit Google'
security: []
responses:
  '200':
    description: Get Google OAuth url!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get Google OAuth url!
            data:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: 'https://accounts.google.com/o/oauth2/v2/auth?scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile&response_type=code&client_id=1031754071946-4vt89ilk6d6537mk6ueruq37ac66avut.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fconfirm-google-auth'
  '500':
    $ref: '../../../components/responses/500.yaml'
